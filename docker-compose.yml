# CodeCeremony — one command to a seeded, working portal.
#
#   docker compose up
#
# That is the whole setup. No database container, no cloud account, no external
# API, no step that reaches the network at runtime. The portal is one static Go
# binary, and the state directory is a bind mount so data survives a restart.
#
# Everything is published on 8080 by default. Override with
# CODE_CEREMONY_PORT if that port is taken.
#
# The image is built from the repository root because the frontend is a separate
# build stage. The runtime is still one static Go binary: Node exists in the
# build, not in the image that runs.

services:
  api:
    build:
      # The context is the repository root rather than ./backend, because the
      # frontend stage needs web/ and the Go stage needs backend/. The build
      # itself still produces one binary with no Node in it.
      context: .
      dockerfile: backend/Dockerfile
    image: codeceremony:local
    container_name: codeceremony
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      # Bound inside the container, published on the host by the port mapping
      # below. Kept separate so the two can differ.
      PUBLIC_PORT: ${CODE_CEREMONY_PORT:-8080}
      DATA_DIR: /var/lib/codeceremony
      # The shared DOGFOOD fixture file ships in the build context, so a cold
      # clone seeds the same invented hackathon as every other submission with
      # no extra download step. Point this elsewhere to seed different data.
      FIXTURES_PATH: /app/fixtures.json
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-codeceremony-dev}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PERSIST_INTERVAL_SECONDS: ${PERSIST_INTERVAL_SECONDS:-2}
      # The same-origin HTML frontend means no cross-origin request is needed,
      # so CORS is closed by default. Set it only if you are running a separate
      # frontend origin.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # No SMTP host means mail is written to the log sink instead of sent, so
      # the portal is fully functional offline.
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_FROM: ""
      SMTP_ENCRYPTION: starttls
      MAIL_INTERVAL_SECONDS: ${MAIL_INTERVAL_SECONDS:-10}
      MAIL_BATCH_SIZE: 20
      MAIL_MAX_ATTEMPTS: 4
    ports:
      - "${CODE_CEREMONY_PORT:-8080}:8080"
    volumes:
      # All durable state is one file. Back the portal up by copying this file,
      # and reset the portal by deleting it and restarting.
      - codeceremony-data:/var/lib/codeceremony
    healthcheck:
      # The binary is distroless, so there is no shell and no curl in the image.
      # The healthcheck therefore runs the portal's own binary.
      test: ["CMD", "/codeceremony", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL

volumes:
  codeceremony-data:
